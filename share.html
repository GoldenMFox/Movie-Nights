<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- private (your own library, or a page that only forwards): kept out of search engines -->
    <meta name="robots" content="noindex" />
    <title>A pick for you · Movie Nights</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Movie Nights" />
    <meta property="og:title" content="🎬 A pick for you on Movie Nights" />
    <meta property="og:description" content="Someone thinks you'll love this. Tap to see what it is, watch the trailer and find where to stream it." />

    <style>
      body {
        margin: 0;
        background: #17181c;
      }
    </style>
    <!-- the first share links (share.html?t=movie-157336&from=…) now open the title page -->
    <script>
      (function () {
        var p = new URLSearchParams(location.search);
        var t = p.get("t") || "";
        p.delete("t");
        var rest = p.toString();
        location.replace(/^(movie|tv)-\d+$/.test(t) ? "title.html?tmdb=" + t + (rest ? "&" + rest : "") : "movies-explore.html");
      })();
    </script>
  </head>

</html>
