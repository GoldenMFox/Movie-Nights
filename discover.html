<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Explore &middot; Movie Nights</title>
    <link rel="icon" href="images/brand/favicon.png" type="image/png" />
    <!--
      Discover moved into the Movies and TV Shows pages (Explore). Old links, bookmarks and the
      installed app's shortcut land here and go on to the right place, with what they asked for:
        ?q=dune&in=tv           → tv-explore.html?q=dune      (in=all / none: movies-explore.html, searching everything)
        ?genre=Horror&type=tv   → tv-explore.html?genre=Horror (type=anime: the anime explorer)
        ?cat=popular-tv         → tv-explore.html?cat=popular-tv (anime / top-anime: the anime explorer)
    -->
    <script>
      (function () {
        var p = new URLSearchParams(location.search);
        var go = "movies-explore.html";
        var out = new URLSearchParams();
        var cat = p.get("cat") || "";
        if (p.get("q")) {
          var where = p.get("in") || "all";
          if (where === "anime") go = "anime-explore.html";
          else if (where === "tv") go = "tv-explore.html";
          out.set("q", p.get("q"));
          if (where === "all") out.set("in", "all");
        } else if (p.get("genre")) {
          var type = p.get("type") || "movie";
          if (type === "anime") go = "anime-explore.html";
          else {
            go = type === "tv" ? "tv-explore.html" : "movies-explore.html";
            out.set("genre", p.get("genre"));
            if (p.get("sort")) out.set("sort", p.get("sort"));
          }
        } else if (cat === "anime" || cat === "top-anime") {
          go = "anime-explore.html";
          out.set("list", cat === "anime" ? "popular" : "top");
        } else if (/-tv$/.test(cat)) {
          go = "tv-explore.html";
          out.set("cat", cat);
        } else if (cat && cat !== "trending") out.set("cat", cat);
        var qs = out.toString();
        location.replace(go + (qs ? "?" + qs : ""));
      })();
    </script>
  </head>
  <body></body>
</html>
